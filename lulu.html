<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070207">
<title>Merry Christmas · A Little Wish</title>
<style>
  :root{
    --ice:#fff0f5;
    --muted:rgba(255,221,234,.60);
    --line:rgba(255,196,219,.24);
    --ease:cubic-bezier(.2,.8,.2,1);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    overflow:hidden;
    background:#070207;
    color:var(--ice);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  #scene{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    cursor:grab;
    touch-action:none;
    outline:none;
  }
  #scene.is-dragging{cursor:grabbing}

  .vignette{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:2;
    background:
      radial-gradient(ellipse 78% 76% at 50% 46%, transparent 36%, rgba(12,1,7,.20) 72%, rgba(7,0,4,.60) 100%),
      linear-gradient(180deg, rgba(9,1,5,.22) 0%, transparent 20%, transparent 76%, rgba(8,0,4,.36) 100%);
  }
  .vignette::after{
    content:"";
    position:absolute;
    inset:0;
    opacity:.035;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
    mix-blend-mode:soft-light;
  }

  .topbar{
    position:fixed;
    z-index:5;
    top:max(24px,env(safe-area-inset-top));
    left:clamp(18px,3.1vw,48px);
    right:clamp(18px,3.1vw,48px);
    display:flex;
    align-items:center;
    justify-content:space-between;
    pointer-events:none;
    opacity:0;
    animation:fade-in 1.7s var(--ease) 1.1s forwards;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    color:rgba(255,224,236,.50);
    font-size:9px;
    font-weight:400;
    letter-spacing:.34em;
    text-transform:uppercase;
    white-space:nowrap;
  }
  .brand-mark{
    width:5px;height:5px;border-radius:50%;
    background:#ffe2ec;
    box-shadow:0 0 10px 2px rgba(255,146,187,.82);
    animation:lamp 4.8s ease-in-out infinite;
  }
  .brand-main{opacity:.55}
  .brand-for{
    font-family:"Cormorant Garamond","Baskerville","Times New Roman",serif;
    font-size:1.08em;
    letter-spacing:.20em;
    text-transform:none;
    color:rgba(255,214,231,.66);
    margin-left:-2px;
  }
  .brand-for::before{
    content:"·";
    margin-right:9px;
    opacity:.55;
    font-family:"Segoe UI",sans-serif;
  }

  .controls{
    display:flex;
    gap:9px;
    pointer-events:auto;
    opacity:0;
    animation:fade-in 1.4s var(--ease) 2.2s forwards;
  }
  .ctrl{
    -webkit-appearance:none;
    appearance:none;
    width:39px;
    height:39px;
    padding:0;
    display:grid;
    place-items:center;
    border-radius:50%;
    border:1px solid rgba(255,190,216,.16);
    background:rgba(30,7,17,.38);
    color:rgba(255,232,241,.76);
    cursor:pointer;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    transition:border-color .35s ease,background .35s ease,color .35s ease,transform .35s var(--ease);
  }
  .ctrl:hover{
    border-color:rgba(255,208,226,.38);
    background:rgba(52,14,30,.50);
    color:#fff;
    transform:translateY(-1px);
  }
  .ctrl:focus-visible{outline:1px solid rgba(255,218,234,.85);outline-offset:3px}
  .ctrl svg{width:16px;height:16px;overflow:visible;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
  .ctrl .off{display:none}
  .ctrl.is-off{color:rgba(255,218,234,.28)}
  .ctrl.is-off .on{display:none}
  .ctrl.is-off .off{display:block}

  .hero{
    position:fixed;
    z-index:6;
    left:0;
    right:0;
    bottom:max(23px,calc(env(safe-area-inset-bottom) + 15px));
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    pointer-events:none;
  }
  .eyebrow{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:15px;
    margin:0 0 clamp(8px,1.1vh,13px);
    color:rgba(255,218,232,.58);
    font-family:"Cormorant Garamond","Baskerville","Times New Roman",serif;
    font-size:clamp(8px,.72vw,10.5px);
    letter-spacing:.48em;
    text-indent:.48em;
    text-transform:uppercase;
    opacity:0;
    transform:translateY(7px);
    animation:rise-in 1.8s var(--ease) 2.45s forwards;
  }
  .eyebrow::before,.eyebrow::after{
    content:"";
    width:clamp(22px,3vw,46px);
    height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,191,216,.52));
  }
  .eyebrow::after{transform:scaleX(-1)}

  h1{
    position:relative;
    margin:0;
    font-family:"Lucida Calligraphy","Segoe Script","Brush Script MT",cursive;
    font-size:clamp(41px,7.9vw,116px);
    font-weight:400;
    line-height:.88;
    letter-spacing:-.028em;
    white-space:nowrap;
    color:transparent;
    background:linear-gradient(179deg,#fffdfb 4%,#fff2f6 33%,#ffdce8 57%,#f3b5c9 82%,#dd8eae 100%);
    -webkit-background-clip:text;
    background-clip:text;
    filter:
      drop-shadow(0 0 7px rgba(255,238,246,.34))
      drop-shadow(0 0 28px rgba(255,168,199,.26))
      drop-shadow(0 0 72px rgba(218,103,145,.20));
    opacity:0;
    transform:translateY(13px) scale(.985);
    animation:title-in 2.3s var(--ease) 1.85s forwards;
  }
  h1::after{
    content:"";
    position:absolute;
    left:13%;
    right:13%;
    bottom:-9%;
    height:32%;
    background:radial-gradient(ellipse at center,rgba(255,171,201,.17),transparent 70%);
    filter:blur(15px);
    z-index:-1;
    pointer-events:none;
  }

  .subtitle{
    margin:clamp(8px,1.2vh,14px) 0 0;
    color:rgba(255,224,236,.72);
    font-family:"Songti SC","STSong","Noto Serif SC","SimSun",serif;
    font-size:clamp(11.5px,1.06vw,14px);
    font-weight:400;
    letter-spacing:.19em;
    text-indent:.19em;
    text-shadow:0 0 20px rgba(255,158,194,.16);
    opacity:0;
    transform:translateY(8px);
    animation:rise-in 1.8s var(--ease) 2.8s forwards;
  }

  .hint{
    position:fixed;
    z-index:5;
    left:clamp(20px,3.1vw,48px);
    bottom:max(30px,calc(env(safe-area-inset-bottom) + 22px));
    display:flex;
    align-items:center;
    gap:10px;
    color:rgba(255,205,224,.32);
    font-size:9px;
    letter-spacing:.22em;
    text-transform:uppercase;
    pointer-events:none;
    opacity:0;
    animation:fade-in 1.8s ease 3.3s forwards;
  }
  .hint::before{
    content:"";
    width:22px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,199,220,.42));
  }

  .corner{
    position:fixed;
    z-index:5;
    right:clamp(20px,3.1vw,48px);
    bottom:max(30px,calc(env(safe-area-inset-bottom) + 23px));
    color:rgba(255,208,225,.25);
    font-family:"Cormorant Garamond","Baskerville",serif;
    font-size:9px;
    letter-spacing:.32em;
    pointer-events:none;
    opacity:0;
    animation:fade-in 1.8s ease 3.4s forwards;
  }

  .fallback{
    position:fixed;
    inset:0;
    z-index:20;
    display:none;
    align-items:center;
    justify-content:center;
    padding:30px;
    text-align:center;
    background:#070207;
    color:rgba(255,225,236,.74);
    font-size:14px;
    line-height:1.9;
    letter-spacing:.08em;
  }
  .fallback.is-visible{display:flex}

  @keyframes fade-in{to{opacity:1}}
  @keyframes rise-in{to{opacity:1;transform:translateY(0)}}
  @keyframes title-in{
    0%{opacity:0;transform:translateY(13px) scale(.985);filter:blur(7px) drop-shadow(0 0 0 transparent)}
    58%{opacity:1}
    100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0) drop-shadow(0 0 7px rgba(255,238,246,.34)) drop-shadow(0 0 28px rgba(255,168,199,.26)) drop-shadow(0 0 72px rgba(218,103,145,.20))}
  }
  @keyframes lamp{
    0%,100%{opacity:.55;box-shadow:0 0 8px 1px rgba(255,146,187,.58)}
    50%{opacity:1;box-shadow:0 0 13px 3px rgba(255,146,187,.94)}
  }

  @media (max-width:760px){
    .topbar{top:max(18px,env(safe-area-inset-top))}
    .brand{font-size:8px;letter-spacing:.27em;gap:9px}
    .ctrl{width:37px;height:37px}
    .hint,.corner{display:none}
    .hero{bottom:max(22px,calc(env(safe-area-inset-bottom) + 15px))}
    h1{font-size:clamp(34px,10.7vw,58px)}
    .subtitle{font-size:10.5px;letter-spacing:.13em;text-indent:.13em}
    .eyebrow{letter-spacing:.34em;text-indent:.34em;gap:10px}
  }
  @media (max-height:620px){
    h1{font-size:clamp(38px,10.2vh,88px)}
    .subtitle{margin-top:5px}
    .eyebrow{margin-bottom:5px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important}
    h1,.eyebrow,.subtitle,.topbar,.controls,.hint,.corner{opacity:1;transform:none}
  }
</style>
</head>
<body>
<canvas id="scene" tabindex="-1" aria-hidden="true"></canvas>
<div class="vignette"></div>

<header class="topbar">
  <div class="brand">
    <i class="brand-mark"></i>
    <span class="brand-main">Evergreen</span>
    <span class="brand-for">for Lulu</span>
  </div>
  <div class="controls">
    <button class="ctrl" id="snowToggle" type="button" aria-label="开启或关闭飘雪" aria-pressed="true" title="飘雪">
      <svg class="on" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2.8v18.4M4.1 7.2l15.8 9.6M19.9 7.2 4.1 16.8"/>
        <path d="m9.2 3.9 2.8 2.4 2.8-2.4M9.2 20.1l2.8-2.4 2.8 2.4M3 10.7l3.6.6.6-3.6M21 13.3l-3.6-.6-.6 3.6M3 13.3l3.6-.6.6 3.6M21 10.7l-3.6.6-.6-3.6"/>
      </svg>
      <svg class="off" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 4v16M5.5 7.8l13 8.4M18.5 7.8l-13 8.4" opacity=".45"/>
        <path d="M3 3l18 18"/>
      </svg>
    </button>
    <button class="ctrl" id="motionToggle" type="button" aria-label="暂停或继续动画" aria-pressed="true" title="暂停 / 继续">
      <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg>
      <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.4 5.7v12.6L18 12 8.4 5.7Z"/></svg>
    </button>
  </div>
</header>

<main class="hero">
  <p class="eyebrow">A little christmas wish</p>
  <h1>Merry Christmas</h1>
  <p class="subtitle">谢谢你一直在我身边</p>
</main>

<div class="hint">拖动旋转视角</div>
<div class="corner">MMXXVI · XII · XXV</div>
<div class="fallback" id="fallback">这棵圣诞树需要浏览器开启 WebGL 才能点亮。<br>请换用最新版 Chrome / Edge / Safari 再试一次。</div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('scene');
  const fallback = document.getElementById('fallback');
  const snowBtn = document.getElementById('snowToggle');
  const motionBtn = document.getElementById('motionToggle');

  const gl = canvas.getContext('webgl', {
    alpha: false,
    antialias: true,
    depth: false,
    stencil: false,
    premultipliedAlpha: false,
    powerPreference: 'high-performance'
  });

  if (!gl) {
    fallback.classList.add('is-visible');
    return;
  }

  const TAU = Math.PI * 2;
  const BASE_Y = -1.90;
  const TREE_H = 4.55;
  const TOP_Y = BASE_Y + TREE_H;
  const BASE_R = 1.72;

  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let dpr = 1;
  let W = 1, H = 1;
  let maxPointSize = 256;
  let elapsed = 0;
  let lastNow = performance.now();
  let snowOn = true;
  // Keep time moving so the opening reveal always completes; reduced motion
  // only removes the slow camera orbit and damps pointer movement.
  let motionOn = true;
  let yawOffset = 0;
  let pitchOffset = 0;
  let targetYaw = 0;
  let targetPitch = 0;
  let dragging = false;
  let dragX = 0, dragY = 0;
  let pointerX = 0, pointerY = 0;
  let cameraDist = 11;

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
  const smoothstep = (a, b, x) => {
    const t = clamp((x - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  };
  const easeOutCubic = t => 1 - Math.pow(1 - t, 3);

  function hash11(n) {
    n = (n << 13) ^ n;
    return 1.0 - ((n * (n * n * 15731 + 789221) + 1376312589) & 0x7fffffff) / 1073741824.0;
  }

  /* ------------------------------------------------------------------ */
  /*  Shader helpers                                                    */
  /* ------------------------------------------------------------------ */

  function compile(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error(log, source);
      throw new Error(log || 'Shader compile failed');
    }
    return shader;
  }

  function program(vertexSource, fragmentSource) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vertexSource));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fragmentSource));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(p) || 'Program link failed');
    }
    return p;
  }

  function uniformMap(p, names) {
    const map = {};
    names.forEach(n => { map[n] = gl.getUniformLocation(p, n); });
    return map;
  }

  /* ------------------------------------------------------------------ */
  /*  Background: a night sky, quietly lit                              */
  /* ------------------------------------------------------------------ */

  const bgProgram = program(`
    attribute vec2 aPos;
    varying vec2 vUv;
    void main() {
      vUv = aPos * 0.5 + 0.5;
      gl_Position = vec4(aPos, 0.0, 1.0);
    }
  `, `
    precision highp float;
    varying vec2 vUv;
    uniform vec2 uRes;
    uniform float uTime;

    float hash21(vec2 p) {
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }

    float noise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      return mix(
        mix(hash21(i), hash21(i + vec2(1.0, 0.0)), f.x),
        mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), f.x),
        f.y
      );
    }

    void main() {
      vec2 uv = vUv;
      vec2 p = (uv - 0.5) * vec2(uRes.x / uRes.y, 1.0);

      vec3 col = vec3(0.0068, 0.0021, 0.0058);

      // A cold, rising light behind the tree.
      float halo = length((uv - vec2(0.5, 0.525)) * vec2(1.22, 1.0));
      col += vec3(0.082, 0.025, 0.051) * exp(-halo * halo * 7.0);

      // The faintest blue on the horizon.
      float horizon = exp(-pow((uv.y - 0.19) / 0.17, 2.0));
      col += vec3(0.046, 0.012, 0.026) * horizon;

      // Soft, slowly drifting night haze.
      float n1 = noise(p * 2.1 + vec2(uTime * 0.004, 0.0));
      float n2 = noise(p * 5.3 - vec2(0.0, uTime * 0.006));
      float haze = smoothstep(0.18, 0.88, uv.y);
      col += vec3(0.016, 0.0055, 0.011) * (n1 * 0.75 + n2 * 0.25) * haze;

      // A barely-there column of starlight.
      float beam = exp(-abs(uv.x - 0.5) * 24.0) * smoothstep(0.22, 0.95, uv.y);
      col += vec3(0.043, 0.017, 0.030) * beam * 0.55;

      // Vignette.
      vec2 vp = (uv - 0.5) * vec2(1.02, 1.0);
      float vig = smoothstep(0.82, 0.24, length(vp));
      col *= mix(0.36, 1.0, vig);

      // Dither to keep the dark gradient smooth.
      col += (hash21(gl_FragCoord.xy + fract(uTime)) - 0.5) * 0.0035;

      gl_FragColor = vec4(max(col, 0.0), 1.0);
    }
  `);

  const bgBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, bgBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
    -1, -1,  3, -1,  -1, 3
  ]), gl.STATIC_DRAW);
  const bgLoc = gl.getAttribLocation(bgProgram, 'aPos');
  const bgUniforms = uniformMap(bgProgram, ['uRes', 'uTime']);

  /* ------------------------------------------------------------------ */
  /*  Sky stars                                                         */
  /* ------------------------------------------------------------------ */

  const skyProgram = program(`
    attribute vec2 aPos;
    attribute vec3 aColor;
    attribute float aSize;
    attribute float aPhase;
    uniform float uDpr;
    uniform float uTime;
    varying vec3 vColor;
    varying float vAlpha;
    varying float vSize;
    void main() {
      gl_Position = vec4(aPos, 0.0, 1.0);
      float tw = 0.54 + 0.46 * sin(uTime * (0.35 + aPhase * 0.8) + aPhase * 19.0);
      tw = 0.52 + tw * 0.48;
      vAlpha = tw;
      vColor = aColor;
      vSize = aSize;
      gl_PointSize = aSize * uDpr * 1.25;
    }
  `, `
    precision highp float;
    varying vec3 vColor;
    varying float vAlpha;
    varying float vSize;
    void main() {
      vec2 q = gl_PointCoord - 0.5;
      float r = length(q) * 2.0;
      if (r > 1.0) discard;
      float a = exp(-r * r * 5.5) * vAlpha;
      if (vSize > 2.4) {
        float crossA = exp(-abs(q.x) * 26.0) * exp(-abs(q.y) * 3.0)
                     + exp(-abs(q.y) * 26.0) * exp(-abs(q.x) * 3.0);
        a += crossA * 0.22 * vAlpha;
      }
      gl_FragColor = vec4(vColor * a, a);
    }
  `);

  const skyCount = 470;
  const skyData = new Float32Array(skyCount * 7);
  for (let i = 0; i < skyCount; i++) {
    const o = i * 7;
    let x = rand(-1, 1);
    let y = rand(-1, 1);
    // Keep the middle of the frame quieter: the tree owns it.
    if (Math.abs(x) < 0.26 && y > -0.62 && y < 0.78) {
      x += x < 0 ? -0.32 : 0.32;
    }
    const big = Math.random();
    const size = big > 0.965 ? rand(3.0, 4.7) : (big > 0.72 ? rand(1.7, 2.7) : rand(0.9, 1.7));
    const warm = Math.random() > 0.83;
    const b = rand(0.45, 1.0);
    skyData[o] = clamp(x, -1, 1);
    skyData[o + 1] = clamp(y, -1, 1);
    skyData[o + 2] = b;
    skyData[o + 3] = warm ? b * rand(0.78, 0.88) : b * rand(0.82, 0.92);
    skyData[o + 4] = warm ? b * rand(0.64, 0.74) : b * rand(0.88, 0.98);
    skyData[o + 5] = size;
    skyData[o + 6] = Math.random();
  }

  const skyBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, skyBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, skyData, gl.STATIC_DRAW);
  const skyA = {
    pos: gl.getAttribLocation(skyProgram, 'aPos'),
    color: gl.getAttribLocation(skyProgram, 'aColor'),
    size: gl.getAttribLocation(skyProgram, 'aSize'),
    phase: gl.getAttribLocation(skyProgram, 'aPhase')
  };
  const skyUniforms = uniformMap(skyProgram, ['uDpr', 'uTime']);

  /* ------------------------------------------------------------------ */
  /*  The tree                                                          */
  /* ------------------------------------------------------------------ */

  const points = [];
  // x, y, z, r, g, b, size, phase, kind, speed
  const STRIDE = 10;

  function add(x, y, z, cr, cg, cb, size, phase, kind, speed = 0) {
    points.push(x, y, z, cr, cg, cb, size, phase, kind, speed);
  }

  function coneRadius(y) {
    const t = clamp((y - BASE_Y) / TREE_H, 0, 1);
    return Math.max(0.018, BASE_R * Math.pow(1 - t, 0.92));
  }

  const palette = [
    [0.98, 0.79, 0.87], // rose quartz
    [1.00, 0.91, 0.95], // pearl
    [0.91, 0.64, 0.76], // dusty rose
    [1.00, 0.86, 0.70], // champagne
    [0.88, 0.72, 0.81]
  ];

  function pickColor(brightness = 1, warmChance = 0.035) {
    const c = palette[Math.random() < warmChance ? 3 : Math.floor(rand(0, 3))];
    const b = brightness * rand(0.72, 1.0);
    return [c[0] * b, c[1] * b, c[2] * b];
  }

  // Branch structure: hundreds of tiny needles catching the light.
  const TIERS = 30;
  for (let tier = 0; tier < TIERS; tier++) {
    const t = (tier + rand(0.18, 0.82)) / TIERS;
    const y = BASE_Y + TREE_H * (0.035 + t * 0.925);
    const maxR = coneRadius(y);
    const arms = 12 + Math.floor(rand(0, 6));

    for (let arm = 0; arm < arms; arm++) {
      const angle = rand(0, TAU);
      const len = maxR * rand(0.52, 1.02);
      const n = 13 + Math.floor(rand(0, 10));
      const droop = rand(0.07, 0.14);

      for (let j = 0; j < n; j++) {
        const u = (j + rand(0.05, 0.95)) / n;
        const rr = len * Math.pow(u, 0.96);
        const side = rand(-0.036, 0.036);
        const ca = Math.cos(angle), sa = Math.sin(angle);
        const x = ca * rr - sa * side + rand(-0.012, 0.012);
        const z = sa * rr + ca * side + rand(-0.012, 0.012);
        const yy = y - droop * Math.pow(u, 1.45) + rand(-0.036, 0.036);
        const c = pickColor(u > 0.82 ? 1.30 : 1.06, 0.042);
        const size = u > 0.82 ? rand(1.9, 3.9) : rand(1.3, 2.85);
        add(x, yy, z, c[0], c[1], c[2], size, Math.random(), 0, rand(0.55, 1.1));
      }
    }
  }

  // Needle mist filling the volume of the tree.
  for (let i = 0; i < 7200; i++) {
    const t = Math.pow(Math.random(), 1.18);
    const y = BASE_Y + 0.08 + TREE_H * 0.925 * t;
    const maxR = coneRadius(y);
    const r = maxR * Math.sqrt(Math.random()) * rand(0.68, 1.015);
    const a = rand(0, TAU);
    const c = pickColor(rand(0.68, 1.12), 0.028);
    add(
      Math.cos(a) * r + rand(-0.018, 0.018),
      y + rand(-0.04, 0.04),
      Math.sin(a) * r + rand(-0.018, 0.018),
      c[0], c[1], c[2],
      rand(1.0, 2.45), Math.random(), 0, rand(0.4, 1.2)
    );
  }

  // A handful of brighter sparks inside the canopy.
  for (let i = 0; i < 230; i++) {
    const t = Math.pow(Math.random(), 0.8);
    const y = BASE_Y + 0.15 + TREE_H * 0.85 * t;
    const maxR = coneRadius(y);
    const a = rand(0, TAU);
    const r = maxR * rand(0.72, 1.01);
    const c = pickColor(1.42, 0.08);
    add(Math.cos(a) * r, y, Math.sin(a) * r, c[0], c[1], c[2], rand(3.8, 7.8), Math.random(), 0, rand(0.2, 0.8));
  }

  // A faint column of light at the heart of the tree.
  for (let i = 0; i < 1100; i++) {
    const y = BASE_Y + 0.10 + TREE_H * 0.90 * Math.random();
    const a = rand(0, TAU);
    const r = coneRadius(y) * rand(0.03, 0.34);
    const c = pickColor(rand(0.78, 1.16), 0.02);
    add(Math.cos(a) * r, y, Math.sin(a) * r, c[0], c[1], c[2], rand(0.9, 2.0), Math.random(), 0, rand(0.4, 1.0));
  }

  // Five ribbons of light spiralling up the tree.
  const RIBBON_BANDS = 5;
  for (let band = 0; band < RIBBON_BANDS; band++) {
    const start = band * TAU / RIBBON_BANDS + rand(-0.08, 0.08);
    const turns = 2.18 + (band % 2) * 0.22;
    const N = 720;

    for (let i = 0; i < N; i++) {
      const s = (i + rand(0.05, 0.95)) / N;
      const y = BASE_Y + 0.075 + TREE_H * 0.885 * s;
      const a = start + s * turns * TAU;
      const rr = coneRadius(y) * 1.045 + Math.sin(s * 55 + band * 2.1) * 0.009;
      const x = Math.cos(a) * rr + rand(-0.014, 0.014);
      const z = Math.sin(a) * rr + rand(-0.014, 0.014);
      const c = pickColor(1.38, 0.015);
      add(x, y + rand(-0.014, 0.014), z, c[0], c[1], c[2], rand(1.45, 2.9), Math.random(), 1, rand(0.3, 0.8));
    }

    // Tiny beads of light threaded along the ribbon.
    const beads = 18;
    for (let i = 0; i < beads; i++) {
      const s = (i + rand(0.15, 0.85)) / beads;
      const y = BASE_Y + 0.08 + TREE_H * 0.885 * s;
      const a = start + s * turns * TAU;
      const rr = coneRadius(y) * 1.05;
      const c = pickColor(1.5, 0.06);
      add(Math.cos(a) * rr, y, Math.sin(a) * rr, c[0], c[1], c[2], rand(5.0, 8.8), Math.random(), 1, rand(0.2, 0.5));
    }
  }

  // A few warm ornaments, sparse enough to stay wintry.
  for (let i = 0; i < 58; i++) {
    const t = rand(0.05, 0.92);
    const y = BASE_Y + TREE_H * t;
    const a = rand(0, TAU);
    const r = coneRadius(y) * rand(0.88, 1.02);
    const b = rand(0.55, 0.9);
    add(
      Math.cos(a) * r, y, Math.sin(a) * r,
      1.0 * b, 0.55 * b, 0.67 * b,
      rand(2.2, 4.6), Math.random(), 0, rand(0.2, 0.6)
    );
  }

  /* ------------------------------------------------------------------ */
  /*  Ground rings                                                      */
  /* ------------------------------------------------------------------ */

  for (let ring = 0; ring < 10; ring++) {
    const radius = 1.52 + ring * 0.255;
    const count = 540 + ring * 22;
    const bright = clamp(0.68 - ring * 0.039, 0.25, 0.68) * rand(0.9, 1.1);

    for (let i = 0; i < count; i++) {
      if (Math.random() < 0.065) continue;
      const a = (i / count) * TAU + rand(-0.006, 0.006);
      const wob = Math.sin(a * 3 + ring * 1.7) * 0.05 + rand(-0.022, 0.022);
      const rr = radius + wob;
      const x = Math.cos(a) * rr;
      const z = Math.sin(a) * rr;
      const y = BASE_Y - 0.018 + Math.sin(a * 2 + ring) * 0.014;
      const front = 0.68 + 0.42 * smoothstep(-0.25, 0.9, Math.sin(a));
      const c = bright * front * rand(0.82, 1.16);
      add(
        x, y, z,
        0.98 * c + 0.070, 0.49 * c + 0.065, 0.68 * c + 0.105,
        rand(1.35, 3.0), Math.random(), 0, rand(0.3, 0.9)
      );
    }
  }

  // Faint dust resting on the snow.
  for (let i = 0; i < 1400; i++) {
    const a = rand(0, TAU);
    const r = Math.sqrt(Math.random()) * 4.1;
    const c = rand(0.12, 0.38);
    add(Math.cos(a) * r, BASE_Y - 0.02 + rand(-0.015, 0.015), Math.sin(a) * r,
      0.68 * c, 0.36 * c, 0.51 * c, rand(0.7, 1.6), Math.random(), 0, rand(0.3, 0.7));
  }

  /* ------------------------------------------------------------------ */
  /*  Snow, bokeh and atmosphere                                        */
  /* ------------------------------------------------------------------ */

  for (let i = 0; i < 780; i++) {
    const c = rand(0.62, 1.0);
    add(
      rand(-5.6, 5.6),
      rand(-3.8, 4.4),
      rand(-3.2, 6.0),
      0.99 * c, 0.84 * c, 0.92 * c,
      rand(0.95, 2.75), Math.random(), 2, rand(0.08, 0.38)
    );
  }
  for (let i = 0; i < 44; i++) {
    const c = rand(0.22, 0.48);
    add(
      rand(-5.8, 5.8),
      rand(-3.6, 4.2),
      rand(1.0, 6.4),
      0.99 * c, 0.83 * c, 0.91 * c,
      rand(4.0, 8.5), Math.random(), 2, rand(0.06, 0.22)
    );
  }

  // Out-of-focus foreground orbs.
  for (let i = 0; i < 22; i++) {
    const side = Math.random() > 0.5 ? 1 : -1;
    const c = rand(0.1, 0.28);
    add(
      side * rand(2.4, 5.4),
      rand(-2.1, 2.2),
      rand(5.0, 7.6),
      0.64 * c, 0.32 * c, 0.45 * c,
      rand(12, 34), Math.random(), 7, rand(0.05, 0.2)
    );
  }

  // Low, colourless mist around the roots.
  for (let i = 0; i < 10; i++) {
    add(
      rand(-2.8, 2.8), rand(-1.85, -0.45), rand(-2.2, 1.2),
      0.075, 0.023, 0.042,
      rand(90, 190), Math.random(), 6, rand(0.1, 0.5)
    );
  }

  /* ------------------------------------------------------------------ */
  /*  The heart topper                                                  */
  /* ------------------------------------------------------------------ */

  const HEART_Y = TOP_Y + 0.42;
  const heartPoints = [];

  function addHeart(x, y, z, cr, cg, cb, size, phase) {
    heartPoints.push(x, y + HEART_Y, z, cr, cg, cb, size, phase, 4, 0);
  }

  // Classic parametric heart curve, normalised around its own centre.
  function heartXY(t) {
    const hx = 16 * Math.pow(Math.sin(t), 3);
    const hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    return [hx * 0.0170, (hy + 2.54) * 0.0170];
  }

  const heartLayers = [
    { k: 1.00, z: 0.000, bright: 1.00 },
    { k: 0.972, z: 0.042, bright: 0.78 },
    { k: 0.972, z: -0.042, bright: 0.78 },
    { k: 0.912, z: 0.018, bright: 0.56 },
    { k: 0.912, z: -0.018, bright: 0.56 }
  ];

  heartLayers.forEach(layer => {
    const count = 210;
    for (let i = 0; i < count; i++) {
      const t = (i + rand(0.08, 0.92)) / count * TAU;
      const [hx, hy] = heartXY(t);
      const jitter = rand(-0.0024, 0.0024);
      const c = layer.bright * rand(0.82, 1.04);
      const rose = Math.random() < 0.42;
      addHeart(
        hx * layer.k + jitter,
        hy * layer.k + jitter * 0.6,
        layer.z + Math.sin(t * 3 + layer.z * 50) * 0.004,
        (rose ? 1.00 : 0.98) * c,
        (rose ? 0.63 : 0.86) * c + 0.055,
        (rose ? 0.76 : 0.93) * c + 0.035,
        rand(1.45, 3.0),
        Math.random()
      );
    }
  });

  // Glints at the two upper lobes and the point at the bottom.
  addHeart(-0.170, 0.138, 0.010, 1.00, 0.88, 0.94, 5.6, Math.random());
  addHeart(0.170, 0.138, 0.010, 1.00, 0.88, 0.94, 5.6, Math.random());
  addHeart(0.000, -0.224, 0.010, 1.00, 0.80, 0.88, 6.8, Math.random());

  // A little rose dust suspended inside the heart.
  for (let i = 0; i < 130; i++) {
    const t = rand(0, TAU);
    const [hx, hy] = heartXY(t);
    const r = Math.sqrt(Math.random()) * 0.78;
    const c = rand(0.28, 0.62);
    addHeart(
      hx * r, hy * r, rand(-0.026, 0.026),
      0.98 * c + 0.12, 0.64 * c + 0.10, 0.77 * c + 0.10,
      rand(0.8, 1.7), Math.random()
    );
  }

  // A small pulsing core, bright enough to feel alive but not hide the notch.
  addHeart(0, 0, 0.012, 0.92, 0.46, 0.60, 9.0, Math.random());
  addHeart(0, 0, 0.006, 1.00, 0.72, 0.82, 4.5, Math.random());

  const sceneArray = new Float32Array(points.concat(heartPoints));
  const sceneBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, sceneBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, sceneArray, gl.STATIC_DRAW);
  const sceneCount = sceneArray.length / STRIDE;

  /* ------------------------------------------------------------------ */
  /*  Scene shaders                                                     */
  /* ------------------------------------------------------------------ */

  const sceneProgram = program(`
    precision highp float;
    attribute vec3 aPos;
    attribute vec3 aColor;
    attribute float aSize;
    attribute float aPhase;
    attribute float aKind;
    attribute float aSpeed;

    uniform mat4 uProj;
    uniform mat4 uView;
    uniform float uTime;
    uniform float uDpr;
    uniform float uReveal;
    uniform float uStarGlow;
    uniform float uDist;
    uniform float uSizeScale;
    uniform float uMaxPoint;
    uniform float uSnow;

    varying vec3 vColor;
    varying float vAlpha;
    varying float vKind;
    varying float vPhase;

    void main() {
      vec3 p = aPos;
      float kind = aKind;

      // Snow drifts down and softly wraps around the scene.
      if (kind > 1.5 && kind < 2.5) {
        p.y = mod(p.y + 3.8 - uTime * aSpeed, 8.2) - 3.8;
        p.x += sin(uTime * 0.26 + aPhase * 6.2831) * 0.20;
        p.z += cos(uTime * 0.19 + aPhase * 5.0) * 0.13;
      }

      // The heart sways only a little, so its silhouette stays readable.
      if (kind > 3.5 && kind < 4.5) {
        float aa = sin(uTime * 0.36) * 0.075 + 0.035;
        float c = cos(aa);
        float s = sin(aa);
        p.xz = mat2(c, -s, s, c) * p.xz;
        p.y += sin(uTime * 0.62 + aPhase * 2.0) * 0.004;
      }

      if (kind > 6.5) {
        p.x += sin(uTime * 0.08 + aPhase * 8.0) * 0.12;
        p.y += cos(uTime * 0.065 + aPhase * 5.0) * 0.08;
      }

      vec4 mv = uView * vec4(p, 1.0);
      gl_Position = uProj * mv;
      float depth = max(0.25, -mv.z);

      float tw = 0.76 + 0.24 * sin(uTime * (0.62 + aSpeed) + aPhase * 6.2831 + p.y * 1.8);
      float alpha = 1.0;

      if (kind < 1.5) {
        alpha *= 1.0 - smoothstep(uReveal - 0.34, uReveal, p.y);
      }
      if (kind > 1.5 && kind < 2.5) {
        alpha *= 0.46 * smoothstep(0.8, 3.2, uTime) * uSnow;
        tw = 0.45 + 0.55 * (0.5 + 0.5 * sin(uTime * 0.8 + aPhase * 20.0));
      }
      if (kind > 2.5 && kind < 3.5) {
        alpha *= uStarGlow;
      }
      if (kind > 3.5 && kind < 4.5) {
        alpha *= uStarGlow;
        tw = 0.86 + 0.14 * sin(uTime * 1.7 + aPhase * 6.2831);
      }
      if (kind > 4.5 && kind < 5.5) {
        alpha *= uStarGlow;
        tw = 0.90 + 0.10 * sin(uTime * 0.7);
      }
      if (kind > 5.5 && kind < 6.5) {
        alpha *= 0.82;
        tw = 0.72 + 0.28 * sin(uTime * 0.12 + aPhase * 4.0);
      }
      if (kind > 6.5) {
        alpha *= 0.62;
        tw = 0.78 + 0.22 * sin(uTime * 0.2 + aPhase * 6.0);
      }

      vColor = aColor;
      vAlpha = alpha * tw;
      vKind = kind;
      vPhase = aPhase;

      float ps = aSize * uDpr * (uDist / depth) * uSizeScale;
      if (kind > 3.5 && kind < 4.5) {
        ps *= 1.0 + 0.055 * sin(uTime * 1.7);
      }
      gl_PointSize = clamp(ps, 1.0, uMaxPoint);
    }
  `, `
    precision highp float;
    varying vec3 vColor;
    varying float vAlpha;
    varying float vKind;
    varying float vPhase;

    void main() {
      vec2 q = gl_PointCoord - 0.5;
      float r = length(q) * 2.0;
      if (r > 1.0) discard;

      float a;
      if (vKind > 4.5 && vKind < 5.5) {
        // The star: a hot core and four long diffraction rays.
        float core = exp(-r * r * 42.0);
        float ax = abs(q.x);
        float ay = abs(q.y);
        float rays = exp(-ay * 95.0) * exp(-ax * 2.9)
                   + exp(-ax * 95.0) * exp(-ay * 2.9);
        float diag = exp(-abs(q.x - q.y) * 110.0) * exp(-abs(q.x + q.y) * 3.4)
                   + exp(-abs(q.x + q.y) * 110.0) * exp(-abs(q.x - q.y) * 3.4);
        a = core * 1.7 + rays * 0.75 + diag * 0.22;
        a *= smoothstep(0.5, 0.40, r) * vAlpha;
      } else if (vKind > 6.5) {
        a = smoothstep(0.5, 0.02, r);
        a *= a * vAlpha;
      } else if (vKind > 5.5 && vKind < 6.5) {
        a = smoothstep(0.5, 0.0, r);
        a *= a * vAlpha * 0.55;
      } else {
        float core = exp(-r * r * 10.5);
        float bloom = exp(-r * r * 3.1);
        a = (core * 0.74 + bloom * 0.44) * vAlpha;
        // A slightly harder centre makes the ribbon read as a thread of light.
        if (vKind > 0.5 && vKind < 1.5) {
          a += exp(-r * r * 30.0) * 0.24 * vAlpha;
        }
      }

      gl_FragColor = vec4(vColor * a, a);
    }
  `);

  const sceneA = {
    pos: gl.getAttribLocation(sceneProgram, 'aPos'),
    color: gl.getAttribLocation(sceneProgram, 'aColor'),
    size: gl.getAttribLocation(sceneProgram, 'aSize'),
    phase: gl.getAttribLocation(sceneProgram, 'aPhase'),
    kind: gl.getAttribLocation(sceneProgram, 'aKind'),
    speed: gl.getAttribLocation(sceneProgram, 'aSpeed')
  };
  const sceneUniforms = uniformMap(sceneProgram, [
    'uProj', 'uView', 'uTime', 'uDpr', 'uReveal', 'uStarGlow',
    'uDist', 'uSizeScale', 'uMaxPoint', 'uSnow'
  ]);

  /* ------------------------------------------------------------------ */
  /*  Matrices                                                          */
  /* ------------------------------------------------------------------ */

  function perspective(fovy, aspect, near, far) {
    const f = 1 / Math.tan(fovy / 2);
    const nf = 1 / (near - far);
    return new Float32Array([
      f / aspect, 0, 0, 0,
      0, f, 0, 0,
      0, 0, (far + near) * nf, -1,
      0, 0, 2 * far * near * nf, 0
    ]);
  }

  function lookAt(eye, center, up) {
    let zx = eye[0] - center[0], zy = eye[1] - center[1], zz = eye[2] - center[2];
    let zl = Math.hypot(zx, zy, zz) || 1;
    zx /= zl; zy /= zl; zz /= zl;

    let xx = up[1] * zz - up[2] * zy;
    let xy = up[2] * zx - up[0] * zz;
    let xz = up[0] * zy - up[1] * zx;
    let xl = Math.hypot(xx, xy, xz) || 1;
    xx /= xl; xy /= xl; xz /= xl;

    const yx = zy * xz - zz * xy;
    const yy = zz * xx - zx * xz;
    const yz = zx * xy - zy * xx;

    return new Float32Array([
      xx, yx, zx, 0,
      xy, yy, zy, 0,
      xz, yz, zz, 0,
      -(xx * eye[0] + xy * eye[1] + xz * eye[2]),
      -(yx * eye[0] + yy * eye[1] + yz * eye[2]),
      -(zx * eye[0] + zy * eye[1] + zz * eye[2]),
      1
    ]);
  }

  /* ------------------------------------------------------------------ */
  /*  Resize                                                            */
  /* ------------------------------------------------------------------ */

  const FOV = 40 * Math.PI / 180;

  function resize() {
    W = Math.max(1, window.innerWidth);
    H = Math.max(1, window.innerHeight);

    const rawDpr = window.devicePixelRatio || 1;
    const pixelBudget = 3.4e6;
    dpr = Math.min(rawDpr, 2.0, Math.sqrt(pixelBudget / (W * H)));
    dpr = Math.max(1.0, dpr);

    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    gl.viewport(0, 0, canvas.width, canvas.height);
    maxPointSize = Math.min(256, gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE)[1] || 256);
  }

  window.addEventListener('resize', resize, { passive: true });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resize, { passive: true });
  }

  /* ------------------------------------------------------------------ */
  /*  Input                                                             */
  /* ------------------------------------------------------------------ */

  canvas.addEventListener('pointerdown', e => {
    dragging = true;
    dragX = e.clientX;
    dragY = e.clientY;
    targetYaw = yawOffset;
    targetPitch = pitchOffset;
    canvas.classList.add('is-dragging');
    canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
  });

  canvas.addEventListener('pointermove', e => {
    if (dragging) {
      const dx = e.clientX - dragX;
      const dy = e.clientY - dragY;
      dragX = e.clientX;
      dragY = e.clientY;
      targetYaw += dx * 0.0042 * (reducedMotion ? 0.4 : 1);
      targetPitch = clamp(targetPitch + dy * 0.0024 * (reducedMotion ? 0.4 : 1), -0.13, 0.16);
    } else {
      pointerX = (e.clientX / W - 0.5) * 2;
      pointerY = (e.clientY / H - 0.5) * 2;
    }
  });

  function endDrag(e) {
    dragging = false;
    canvas.classList.remove('is-dragging');
    if (e && canvas.releasePointerCapture && e.pointerId !== undefined) {
      try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
    }
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('pointerleave', e => { if (!dragging) { pointerX *= 0.5; pointerY *= 0.5; } });

  snowBtn.addEventListener('click', () => {
    snowOn = !snowOn;
    snowBtn.classList.toggle('is-off', !snowOn);
    snowBtn.setAttribute('aria-pressed', String(snowOn));
    snowBtn.title = snowOn ? '关闭飘雪' : '开启飘雪';
  });

  motionBtn.addEventListener('click', () => {
    motionOn = !motionOn;
    motionBtn.classList.toggle('is-off', !motionOn);
    motionBtn.setAttribute('aria-pressed', String(motionOn));
    motionBtn.title = motionOn ? '暂停动画' : '继续动画';
    lastNow = performance.now();
  });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) lastNow = performance.now();
  });

  /* ------------------------------------------------------------------ */
  /*  Render                                                            */
  /* ------------------------------------------------------------------ */

  function drawBackground(time) {
    gl.disable(gl.BLEND);
    gl.useProgram(bgProgram);
    gl.bindBuffer(gl.ARRAY_BUFFER, bgBuffer);
    gl.enableVertexAttribArray(bgLoc);
    gl.vertexAttribPointer(bgLoc, 2, gl.FLOAT, false, 0, 0);
    gl.uniform2f(bgUniforms.uRes, canvas.width, canvas.height);
    gl.uniform1f(bgUniforms.uTime, time);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.disableVertexAttribArray(bgLoc);
  }

  function drawSky(time) {
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.useProgram(skyProgram);
    gl.bindBuffer(gl.ARRAY_BUFFER, skyBuffer);
    const stride = 7 * 4;
    gl.enableVertexAttribArray(skyA.pos);
    gl.vertexAttribPointer(skyA.pos, 2, gl.FLOAT, false, stride, 0);
    gl.enableVertexAttribArray(skyA.color);
    gl.vertexAttribPointer(skyA.color, 3, gl.FLOAT, false, stride, 8);
    gl.enableVertexAttribArray(skyA.size);
    gl.vertexAttribPointer(skyA.size, 1, gl.FLOAT, false, stride, 20);
    gl.enableVertexAttribArray(skyA.phase);
    gl.vertexAttribPointer(skyA.phase, 1, gl.FLOAT, false, stride, 24);
    gl.uniform1f(skyUniforms.uDpr, dpr);
    gl.uniform1f(skyUniforms.uTime, time);
    gl.drawArrays(gl.POINTS, 0, skyCount);
    [skyA.pos, skyA.color, skyA.size, skyA.phase].forEach(loc => gl.disableVertexAttribArray(loc));
  }

  function drawScene(time, proj, view, starGlow, reveal) {
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.useProgram(sceneProgram);
    gl.bindBuffer(gl.ARRAY_BUFFER, sceneBuffer);
    const stride = STRIDE * 4;

    gl.enableVertexAttribArray(sceneA.pos);
    gl.vertexAttribPointer(sceneA.pos, 3, gl.FLOAT, false, stride, 0);
    gl.enableVertexAttribArray(sceneA.color);
    gl.vertexAttribPointer(sceneA.color, 3, gl.FLOAT, false, stride, 12);
    gl.enableVertexAttribArray(sceneA.size);
    gl.vertexAttribPointer(sceneA.size, 1, gl.FLOAT, false, stride, 24);
    gl.enableVertexAttribArray(sceneA.phase);
    gl.vertexAttribPointer(sceneA.phase, 1, gl.FLOAT, false, stride, 28);
    gl.enableVertexAttribArray(sceneA.kind);
    gl.vertexAttribPointer(sceneA.kind, 1, gl.FLOAT, false, stride, 32);
    gl.enableVertexAttribArray(sceneA.speed);
    gl.vertexAttribPointer(sceneA.speed, 1, gl.FLOAT, false, stride, 36);

    gl.uniformMatrix4fv(sceneUniforms.uProj, false, proj);
    gl.uniformMatrix4fv(sceneUniforms.uView, false, view);
    gl.uniform1f(sceneUniforms.uTime, time);
    gl.uniform1f(sceneUniforms.uDpr, dpr);
    gl.uniform1f(sceneUniforms.uReveal, reveal);
    gl.uniform1f(sceneUniforms.uStarGlow, starGlow);
    gl.uniform1f(sceneUniforms.uDist, cameraDist);
    gl.uniform1f(sceneUniforms.uSizeScale, clamp(H / 800, 0.90, 1.32));
    gl.uniform1f(sceneUniforms.uMaxPoint, maxPointSize);
    gl.uniform1f(sceneUniforms.uSnow, snowOn ? 1 : 0);

    gl.drawArrays(gl.POINTS, 0, sceneCount);

    [sceneA.pos, sceneA.color, sceneA.size, sceneA.phase, sceneA.kind, sceneA.speed]
      .forEach(loc => gl.disableVertexAttribArray(loc));
  }

  function render(time) {
    const aspect = W / H;
    // Keep the tree comfortably in frame on narrow portrait screens.
    const halfHeight = Math.max(3.92, 2.16 / Math.max(0.42, aspect));
    cameraDist = halfHeight / Math.tan(FOV / 2);

    const autoYaw = reducedMotion ? 0 : Math.sin(time * 0.115) * 0.046;
    const targetYawFinal = autoYaw + targetYaw + (dragging ? 0 : pointerX * 0.016);
    const targetPitchFinal = targetPitch + pointerY * 0.012;
    yawOffset += (targetYawFinal - yawOffset) * 0.045;
    pitchOffset += (targetPitchFinal - pitchOffset) * 0.045;

    const pitch = 0.178 + pitchOffset;
    const eye = [
      Math.sin(yawOffset) * Math.cos(pitch) * cameraDist,
      0.42 + Math.sin(pitch) * cameraDist,
      Math.cos(yawOffset) * Math.cos(pitch) * cameraDist
    ];
    const view = lookAt(eye, [0, 0.42, 0], [0, 1, 0]);
    const proj = perspective(FOV, aspect, 0.1, 80);

    const reveal = -2.30 + 6.55 * easeOutCubic(clamp((time - 0.18) / 4.1, 0, 1));
    const starGlow = smoothstep(2.65, 4.05, time);

    gl.clearColor(0.0068, 0.0021, 0.0058, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);

    drawBackground(time);
    drawSky(time);
    drawScene(time, proj, view, starGlow, reveal);
  }

  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - lastNow) / 1000));
    lastNow = now;
    if (motionOn && !document.hidden) elapsed += dt;

    render(elapsed);
    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
